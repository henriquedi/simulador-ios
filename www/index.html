    fav.href = currentLogoURI;
    document.head.appendChild(fav);
  </script>
</head>

    <!-- ========================================================= -->

      <!-- Barra Discreta no Topo com E-mail Logado e Botão Sair -->

             <!-- Logo Principal -->

             <!-- Overlay indicando clique -->

               <i data-lucide="image-plus" class="w-6 h-6 text-white"></i>

          <!-- Permissões Nativas -->

            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="smartphone" class="text-zinc-400 w-4 h-4"></i>
              <h3 class="text-sm font-semibold text-zinc-300">Notifica&ccedil;&otilde;es do Aparelho</h3>
            </div>
            <button id="btn-native-enable" class="w-full bg-zinc-800 text-zinc-200 hover:bg-zinc-700 flex items-center justify-center gap-2 px-4 py-3.5 rounded-xl font-semibold transition-all active:scale-[0.98]">

            </button>
            <button id="btn-native-test" class="w-full bg-zinc-800 text-zinc-200 hover:bg-zinc-700 flex items-center justify-center gap-2 px-4 py-3.5 rounded-xl font-semibold transition-all active:scale-[0.98]">

      <!-- Footer / Ações -->
      <div class="p-5 bg-zinc-950 border-t border-zinc-900">
        <button id="btn-start" class="w-full bg-orange-500 text-white hover:bg-orange-600 shadow-[0_0_15px_rgba(249,115,22,0.3)] flex items-center justify-center gap-2 px-4 py-4 rounded-2xl font-semibold text-lg transition-all active:scale-[0.98]">
          <i data-lucide="play" class="w-5 h-5 fill-current"></i> Iniciar Disparos
        </button>
        
        <div id="running-state" class="hidden space-y-3">
          <div class="flex justify-between items-center px-2">
            <span class="text-sm font-medium text-orange-500 animate-pulse flex items-center gap-2">
              <div class="w-2 h-2 rounded-full bg-orange-500"></div>
              Rodando...
            </span>
            <span id="progress-text" class="text-sm font-bold bg-zinc-900 px-3 py-1 rounded-full text-zinc-300">
              0 / 5
            </span>
          </div>
          <button id="btn-stop" class="w-full bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-500/20 flex items-center justify-center gap-2 px-4 py-4 rounded-2xl font-semibold text-lg transition-all active:scale-[0.98]">
            <i data-lucide="square" class="w-5 h-5 fill-current"></i> Parar Agora

    <!-- Barra inferior do iPhone -->

  </div>

  <script>
    // 1. Inicializar Ícones e injeção de imagens
    lucide.createIcons();
    document.getElementById('main-logo-img').src = currentLogoURI;
    document.getElementById('auth-logo-img').src = currentLogoURI;

    // =========================================================================
    // SISTEMA DE AUTENTICAÇÃO (LOCALSTORAGE - SEM 2FA)
    // =========================================================================
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const authSlider = document.getElementById('auth-slider');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const authMsg = document.getElementById('auth-msg');
    const loggedEmailEl = document.getElementById('logged-email');

    const showAuthMsg = (text, isError = true) => {
      authMsg.innerText = text;
      authMsg.className = `mb-4 p-3 rounded-xl text-xs font-medium text-center ${
        isError
          ? 'bg-red-500/10 text-red-400 border border-red-500/20'
          : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
      }`;
      authMsg.classList.remove('hidden');
    };

    const hideAuthMsg = () => authMsg.classList.add('hidden');

    const getUsers = () => JSON.parse(localStorage.getItem('hotmart_users') || '[]');
    const saveUsers = (users) => localStorage.setItem('hotmart_users', JSON.stringify(users));

    const checkSession = () => {
      const sessionEmail = localStorage.getItem('hotmart_session');
      if (sessionEmail) {
        loggedEmailEl.innerText = sessionEmail;
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
      } else {
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
      }
    };
    checkSession();

    const switchAuthTab = (mode, keepMsg = false) => {
      if (!keepMsg) hideAuthMsg();
      if (mode === 'login') {
        authSlider.style.transform = 'translateX(0)';
        tabLogin.classList.replace('text-zinc-500', 'text-white');
        tabRegister.classList.replace('text-white', 'text-zinc-500');
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      } else {
        authSlider.style.transform = 'translateX(100%)';
        tabRegister.classList.replace('text-zinc-500', 'text-white');
        tabLogin.classList.replace('text-white', 'text-zinc-500');
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
      }
    };

    tabLogin.onclick = () => switchAuthTab('login');
    tabRegister.onclick = () => switchAuthTab('register');

    // Máscara automática de celular com DDD: (00) 00000-0000
    const regPhone = document.getElementById('reg-phone');
    regPhone.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 6) {
        v = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
      } else if (v.length > 2) {
        v = `(${v.slice(0, 2)}) ${v.slice(2)}`;
      } else if (v.length > 0) {
        v = `(${v}`;
      }
      e.target.value = v;
    });

    // Submit Cadastrar -> Salva no localStorage e redireciona para Entrar com Gmail preenchido
    formRegister.onsubmit = (e) => {
      e.preventDefault();
      hideAuthMsg();

      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const phone = regPhone.value.trim();
      const pass = document.getElementById('reg-pass').value;

      if (!email.endsWith('@gmail.com')) {
        return showAuthMsg("Informe um endereço válido do Gmail (@gmail.com).");
      }
      if (phone.replace(/\D/g, '').length < 11) {
        return showAuthMsg("Digite um número de celular válido com DDD.");
      }
      if (pass.length < 6) {
        return showAuthMsg("A senha deve ter no mínimo 6 caracteres.");
      }

      const users = getUsers();
      if (users.some(u => u.email === email)) {
        return showAuthMsg("Este Gmail já está cadastrado. Acesse pela aba Entrar.");
      }

      users.push({ email, phone, pass, createdAt: new Date().toISOString() });
      saveUsers(users);

      // Limpa o formulário de cadastro
      formRegister.reset();

      // Redireciona para a aba Entrar com o Gmail preenchido e foco na senha
      document.getElementById('login-email').value = email;
      document.getElementById('login-pass').value = '';
      showAuthMsg("Cadastro realizado! Digite sua senha para entrar.", false);
      switchAuthTab('login', true);
      document.getElementById('login-pass').focus();
    };

    // Submit Entrar -> Valida e libera o app
    formLogin.onsubmit = (e) => {
      e.preventDefault();
      hideAuthMsg();

      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass').value;

      if (!email.endsWith('@gmail.com')) {
        return showAuthMsg("Digite um endereço @gmail.com válido.");
      }

      const users = getUsers();
      const found = users.find(u => u.email === email && u.pass === pass);
      if (!found) {
        return showAuthMsg("Gmail ou senha incorretos.");
      }

      localStorage.setItem('hotmart_session', found.email);
      document.getElementById('login-pass').value = '';
      checkSession();
    };

    // Botão Sair
    document.getElementById('btn-logout').onclick = () => {
      stop();
      localStorage.removeItem('hotmart_session');
      document.getElementById('login-pass').value = '';
      switchAuthTab('login');
      checkSession();
    };

    // =========================================================================
    // LÓGICA ORIGINAL DO APP HOTMART
    // =========================================================================
    const logoUploadInp = document.getElementById('logo-upload');
    const logoBtn = document.getElementById('logo-btn');
    
    logoBtn.onclick = () => {
      logoUploadInp.click();
    };
    
    logoUploadInp.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const base64Str = event.target.result;
        currentLogoURI = base64Str;
        localStorage.setItem('hotmart_custom_logo', base64Str);
        
        document.getElementById('main-logo-img').src = base64Str;
        document.getElementById('auth-logo-img').src = base64Str;
        document.getElementById('dynamic-favicon').href = base64Str;
        
        alert("Sua imagem foi salva no aplicativo com sucesso! As novas notificações usarão esta foto.");
      };
      reader.readAsDataURL(file);
    };

    // 2. Estado Global
    let settings = { value: '97,00', count: 5, interval: 3, currency: 'BRL', method: 'Pix' };
    let isRunning = false;
    let timerId = null;
    let currentProgress = 0;

    // 3. Mapeamento de Elementos UI
    const el = {
      val: document.getElementById('inp-value'),
      count: document.getElementById('inp-count'),
      interval: document.getElementById('inp-interval'),
      method: document.getElementById('inp-method'),
      btnBrl: document.getElementById('btn-brl'),
      btnUsd: document.getElementById('btn-usd'),
      slider: document.getElementById('currency-slider'),
      sym: document.getElementById('currency-symbol'),
      btnStart: document.getElementById('btn-start'),
      btnStop: document.getElementById('btn-stop'),
      runningState: document.getElementById('running-state'),
      progressText: document.getElementById('progress-text'),
      btnNativeEnable: document.getElementById('btn-native-enable'),
      btnNativeTest: document.getElementById('btn-native-test'),
    };

    // 4. Funções de UI
    const setCurrency = (curr) => {
      settings.currency = curr;
      if (curr === 'BRL') {
        el.slider.style.transform = 'translateX(0)';
        el.btnBrl.classList.replace('text-zinc-500', 'text-white');
        el.btnUsd.classList.replace('text-white', 'text-zinc-500');
        el.sym.innerText = 'R$';
      } else {
        el.slider.style.transform = 'translateX(100%)';
        el.btnUsd.classList.replace('text-zinc-500', 'text-white');
        el.btnBrl.classList.replace('text-white', 'text-zinc-500');
        el.sym.innerText = 'US$';
      }
    };

    el.btnBrl.onclick = () => setCurrency('BRL');
    el.btnUsd.onclick = () => setCurrency('USD');

    const updatePermissionUI = () => {
      if ('Notification' in window && Notification.permission === 'granted') {
        el.btnNativeEnable.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-orange-500"></i> Aparelho Ativado`;
        lucide.createIcons();
      }
    };
    updatePermissionUI();

    // 5. Lógica de Disparo
    const fireNotification = () => {
      const curr = settings.currency === 'BRL' ? 'R$' : 'US$';
      
      // Gerador de 10 dígitos aleatórios (HP + 10 números)
      const randomId = Math.floor(1000000000 + Math.random() * 9000000000); 

      let title = '';
      let body = `Sua comissão: ${curr} ${settings.value} - HP${randomId}`;

      if (settings.method === 'Boleto') {
        title = "Venda realizada com o boleto";
      } else if (settings.method === 'Cartão de Crédito') {
        title = "Venda realizada com Cartão de Crédito";
      } else {
        // Pix
        title = "Venda realizada com o Pix";
      }
      
      // Disparar APENAS Notificação Nativa do Celular
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, { body, icon: currentLogoURI });
        } catch (e) {
          console.warn("Erro ao disparar nativa", e);
        }
      }
    };

    // 6. Controles de Tempo
    const stop = () => {
      isRunning = false;
      clearTimeout(timerId);
      el.btnStart.classList.remove('hidden');
      el.runningState.classList.add('hidden');
    };

    const runLoop = () => {
      if (!isRunning) return;
      
      currentProgress++;
      el.progressText.innerText = `${currentProgress} / ${settings.count}`;
      fireNotification();

      if (currentProgress >= settings.count) {
        stop();
      } else {
        timerId = setTimeout(runLoop, settings.interval * 1000);
      }
    };

    el.btnStart.onclick = () => {
      settings.value = el.val.value;
      settings.count = parseInt(el.count.value) || 1;
      settings.interval = parseInt(el.interval.value) || 1;
      settings.method = el.method.value;

      isRunning = true;
      currentProgress = 0;
      
      el.btnStart.classList.add('hidden');
      el.runningState.classList.remove('hidden');
      el.progressText.innerText = `0 / ${settings.count}`;
      
      runLoop();
    };

    el.btnStop.onclick = stop;

    // 7. Eventos Nativos
    el.btnNativeEnable.onclick = async () => {
      if (!('Notification' in window)) return alert("Seu navegador não suporta notificações.");
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        alert("Notificações ativadas com sucesso!");
        updatePermissionUI();
      } else {
        alert("Permissão negada. Você pode precisar liberar nas configurações do seu celular.");
      }
    };

    el.btnNativeTest.onclick = () => {
      if (Notification.permission !== 'granted') return alert("Ative as notificações primeiro clicando no botão acima.");
      fireNotification();
    };
  </script>
</body>
